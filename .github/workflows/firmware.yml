name: MD|442 firmware (SMK-37 + FM-1)
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04            # x86-64: the JieLi compiler runs natively, no Docker
    steps:
      - uses: actions/checkout@v4
      - name: Get X0X SMK-37 source (GPL-3.0) and apply MD|442
        run: |
          git clone -b smk37 https://github.com/genkigenki/fm1-x0x x0x
          git -C x0x checkout 8af3731713ba6062f17b403300f436aac50aaf30
          git -C x0x apply "$GITHUB_WORKSPACE/firmware/md442-smk37.patch"
      - name: Toolchain and SDK
        run: |
          pip install Pillow
          sh x0x/tools/get_toolchain.sh
          # JieLi's AC79 SDK (Apache-2.0), tag V1.2.1: only 3 files are used. gitee asks for a login from CI, so this
          # takes the same tag from a GitHub mirror, sparse (the full SDK is ~700 MB).
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
            https://github.com/amitv87/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set --no-cone /cpu/wl82/tools/
          ls -la "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"
      - name: Build Elite and Pro
        run: |
          mkdir -p out
          cd x0x
          BOARD=smk37 MODEL=elite ./build.sh --release 1.0
          cp "$(ls -t build/*.fwsc | head -1)" ../out/md442-smk37-elite.fwsc
          BOARD=smk37 ./build.sh --release 1.0
          cp "$(ls -t build/*.fwsc | head -1)" ../out/md442-smk37-pro.fwsc
          ./build.sh --release 1.0               # the M-VAVE FM-1 (same chip; X0X's original target)
          cp "$(ls -t build/*.fwsc | head -1)" ../out/md442-fm1.fwsc
          git diff > ../out/md442-smk37.patch
          cd .. && cp firmware/INSTALL.md out/ && tar czf out/md442-smk37-source.tar.gz --exclude=.git x0x/firmware x0x/tools x0x/build.sh x0x/LICENSE x0x/SMK37.md x0x/BUILDING.md
      - uses: actions/upload-artifact@v4
        with: { name: md442-smk37-firmware, path: out/ }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=md442-smk37-${GITHUB_RUN_NUMBER}
          gh release create "$TAG" out/* --title "MD|442 for SMK-37 (build ${GITHUB_RUN_NUMBER})" --notes-file firmware/INSTALL.md
